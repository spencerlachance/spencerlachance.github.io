<!DOCTYPE html>
<html>
<head>
	<title>Link Converter</title>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
	<link href="https://fonts.googleapis.com/css?family=Libre+Barcode+128+Text|Merriweather|Sunflower:300" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="css/global.css">
	<link rel="stylesheet" type="text/css" href="css/converter.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="scripts.js"></script>
	<script src="https://kit.fontawesome.com/79f6ff16aa.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="header-wrapper"></div>
<div class="jumbotron">
	<h1>Link Converter</h1>
	<p>Spotify &harr; Apple Music &harr; YouTube</p>
</div>
<div class="project container" id="converter">
	<div class="cx-wrap">
		<div class="cx-bar">
			<input id="cx-url" class="cx-input" type="url" inputmode="url" autocomplete="off"
			       spellcheck="false" placeholder="Paste a Spotify, Apple Music, or YouTube link&hellip;"
			       aria-label="Music link" />
			<button id="cx-go" class="cx-go">Convert</button>
		</div>
		<p class="cx-tip">Paste a song link (or a Spotify/Apple Music album link) and get the matches on the other services.</p>
		<div id="cx-status" aria-live="polite"></div>
	</div>
</div>

<script>
(function () {
	var SVC = { spotify: { name: "Spotify" }, apple: { name: "Apple Music" }, youtube: { name: "YouTube" } };
	var ALL_SERVICES = ["spotify", "apple", "youtube"];
	var input = document.getElementById("cx-url");
	var button = document.getElementById("cx-go");
	var statusEl = document.getElementById("cx-status");

	function esc(s) {
		return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
		});
	}
	function setLoading(on) { button.disabled = on; button.textContent = on ? "Working…" : "Convert"; }
	function note(msg, err) { statusEl.innerHTML = '<div class="cx-note' + (err ? " err" : "") + '">' + msg + "</div>"; }
	function loading() { statusEl.innerHTML = '<div class="cx-note"><span class="cx-spin"></span>Finding it on the other service…</div>'; }

	function detectService(url) {
		if (/open\.spotify\.com\/track\//.test(url)) return { service: "spotify", type: "track" };
		if (/open\.spotify\.com\/album\//.test(url)) return { service: "spotify", type: "album" };
		if (/music\.apple\.com\//.test(url)) {
			var trackId = null;
			try { trackId = new URL(url).searchParams.get("i"); } catch (e) {}
			return { service: "apple", type: trackId ? "track" : "album" };
		}
		if (/^https?:\/\/(www\.|music\.)?youtube\.com\/watch/.test(url) || /^https?:\/\/youtu\.be\//.test(url)) {
			return { service: "youtube", type: "track" };
		}
		return null;
	}

	function getSpotifyMeta(url) {
		return fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent(url))
			.then(function (r) {
				if (!r.ok) throw new Error("oEmbed failed");
				return r.json();
			})
			.then(function (d) {
				return { title: d.title || "", artist: d.author_name || "", artwork: d.thumbnail_url };
			});
	}

	function parseYoutubeTitle(d) {
		var raw = d.title || "";
		var author = (d.author_name || "").replace(/\s*-\s*Topic\s*$/i, "").trim();
		var cleaned = raw
			.replace(/[\(\[][^\)\]]*\b(official\s*(music\s*)?video|official\s*audio|lyrics?|lyric\s*video|visualizer|audio|mv|hd|4k|remaster(ed)?)\b[^\)\]]*[\)\]]/gi, "")
			.replace(/\s+/g, " ")
			.trim();
		var title = cleaned || raw, artist = author;
		var m = cleaned.match(/^(.+?)\s[-–—]\s(.+)$/);
		if (m) { artist = m[1].trim(); title = m[2].trim(); }
		return { title: title, artist: artist, artwork: d.thumbnail_url };
	}

	function getYoutubeMeta(url) {
		return fetch("https://www.youtube.com/oembed?url=" + encodeURIComponent(url) + "&format=json")
			.then(function (r) {
				if (!r.ok) throw new Error("oEmbed failed");
				return r.json();
			})
			.then(parseYoutubeTitle);
	}

	function itunesJsonp(id, entity) {
		return new Promise(function (resolve, reject) {
			var cb = "_itcb_" + Math.random().toString(36).slice(2);
			var script = document.createElement("script");
			var timer = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, 8000);
			function cleanup() {
				delete window[cb];
				if (script.parentNode) script.parentNode.removeChild(script);
				clearTimeout(timer);
			}
			window[cb] = function (data) { cleanup(); resolve(data); };
			script.onerror = function () { cleanup(); reject(new Error("load error")); };
			script.src = "https://itunes.apple.com/lookup?id=" + id + "&entity=" + (entity || "song") + "&callback=" + cb;
			document.head.appendChild(script);
		});
	}

	function parseAppleIds(url) {
		try {
			var u = new URL(url);
			var trackId = u.searchParams.get("i");
			var parts = u.pathname.split("/").filter(Boolean);
			var pathId = /^\d+$/.test(parts[parts.length - 1]) ? parts[parts.length - 1] : null;
			return { trackId: trackId, albumId: pathId };
		} catch (e) { return {}; }
	}

	function getAppleMeta(url) {
		var ids = parseAppleIds(url);
		var isAlbum = !ids.trackId && !!ids.albumId;
		var id = ids.trackId || ids.albumId;
		if (!id) return Promise.reject(new Error("Can't parse Apple Music URL"));
		return itunesJsonp(id, isAlbum ? "album" : "song").then(function (d) {
			if (!d.results || !d.results.length) throw new Error("Not found");
			var track = null;
			for (var i = 0; i < d.results.length; i++) {
				if (d.results[i].wrapperType === "track") { track = d.results[i]; break; }
			}
			var result = track || d.results[0];
			return {
				title: result.trackName || result.collectionName,
				artist: result.artistName,
				artwork: result.artworkUrl100 ? result.artworkUrl100.replace("100x100bb", "300x300bb") : null
			};
		});
	}

	function searchApple(title, artist, type) {
		var term = encodeURIComponent(artist ? title + " " + artist : title);
		var entity = type === "album" ? "album" : "song";
		return fetch("https://itunes.apple.com/search?term=" + term + "&entity=" + entity + "&limit=1")
			.then(function (r) { return r.json(); })
			.then(function (d) {
				if (!d.results || !d.results[0]) return null;
				var res = d.results[0];
				return type === "album" ? (res.collectionViewUrl || null) : (res.trackViewUrl || null);
			});
	}

	function spotifySearchUrl(title, artist) {
		return "https://open.spotify.com/search/" + encodeURIComponent(artist ? title + " " + artist : title);
	}

	// Update this after deploying the Cloudflare Worker
	var SPOTIFY_WORKER_URL = "https://spotify-search.spencerlachance25.workers.dev";

	function searchSpotify(title, artist, type) {
		var q = artist ? title + " " + artist : title;
		var qs = "?q=" + encodeURIComponent(q) + "&type=" + encodeURIComponent(type);
		return fetch(SPOTIFY_WORKER_URL + qs)
			.then(function (r) { return r.ok ? r.json() : null; })
			.then(function (d) { return d && d.url ? d.url : null; })
			.catch(function () { return null; });
	}

	var YOUTUBE_API_KEY = "AIzaSyDfP0myeSpNn6-iSm6UBaq9YO28Ha5oqsw";

	function youtubeSearchUrl(title, artist) {
		return "https://www.youtube.com/results?search_query=" + encodeURIComponent(artist ? title + " " + artist : title);
	}

	function searchYoutube(title, artist) {
		var q = artist ? title + " " + artist : title;
		var qs = "?part=snippet&maxResults=1&type=video&videoCategoryId=10&q=" + encodeURIComponent(q) + "&key=" + YOUTUBE_API_KEY;
		return fetch("https://www.googleapis.com/youtube/v3/search" + qs)
			.then(function (r) { return r.ok ? r.json() : null; })
			.then(function (d) {
				var item = d && d.items && d.items[0];
				return item && item.id ? "https://www.youtube.com/watch?v=" + item.id.videoId : null;
			})
			.catch(function () { return null; });
	}

	function buildTarget(targetService, meta, type) {
		if (targetService === "apple") {
			return searchApple(meta.title, meta.artist, type).then(function (appleUrl) {
				var fallbackUrl = "https://music.apple.com/search#" + encodeURIComponent(meta.artist ? meta.title + " " + meta.artist : meta.title);
				return { service: "apple", url: appleUrl || fallbackUrl, title: meta.title, artist: meta.artist, artwork: meta.artwork, matchedBy: appleUrl ? "exact" : "search" };
			});
		}
		if (targetService === "spotify") {
			return searchSpotify(meta.title, meta.artist, type).then(function (spotifyUrl) {
				return { service: "spotify", url: spotifyUrl || spotifySearchUrl(meta.title, meta.artist), title: meta.title, artist: meta.artist, artwork: meta.artwork, matchedBy: spotifyUrl ? "exact" : "search" };
			});
		}
		return searchYoutube(meta.title, meta.artist).then(function (ytUrl) {
			return { service: "youtube", url: ytUrl || youtubeSearchUrl(meta.title, meta.artist), title: meta.title, artist: meta.artist, artwork: meta.artwork, matchedBy: ytUrl ? "exact" : "search" };
		});
	}

	function run() {
		var raw = input.value.trim();
		if (!raw) { input.focus(); return; }
		var detected = detectService(raw);
		if (!detected) {
			note("Paste a Spotify, Apple Music, or YouTube song link.", true);
			return;
		}
		var service = detected.service;
		var type = detected.type;
		setLoading(true); loading();

		var metaP = service === "spotify" ? getSpotifyMeta(raw) : service === "apple" ? getAppleMeta(raw) : getYoutubeMeta(raw);
		metaP.then(function (meta) {
			var targets = ALL_SERVICES.filter(function (s) {
				if (s === service) return false;
				if (s === "youtube" && type === "album") return false; // YouTube matching is songs-only
				return true;
			});
			return Promise.all(targets.map(function (t) { return buildTarget(t, meta, type); })).then(function (results) {
				render(
					{ service: service, url: raw, title: meta.title, artist: meta.artist, artwork: meta.artwork },
					results
				);
			});
		}).catch(function () {
			note("Couldn't get info. Check the link and try again.", true);
		}).then(function () { setLoading(false); });
	}

	function sideHtml(obj, role) {
		var svc = SVC[obj.service] || { name: obj.service };
		var cls = obj.service === "spotify" ? "spotify" : (obj.service === "apple" ? "apple" : "youtube");
		var art = obj.artwork ? '<img class="cx-art" src="' + esc(obj.artwork) + '" alt="" />' : '<div class="cx-art"></div>';
		var label = (role === "source" ? "From " : "") + svc.name;
		var acts = (role === "target")
			? '<div class="cx-acts"><button class="cx-btn copy" data-url="' + esc(obj.url) + '">Copy</button>' +
			  '<a class="cx-btn" href="' + esc(obj.url) + '" target="_blank" rel="noopener">Open</a></div>'
			: '<div class="cx-acts"><a class="cx-btn" href="' + esc(obj.url) + '" target="_blank" rel="noopener">Open</a></div>';
		return '<div class="cx-side">' + art +
			'<div class="cx-meta"><div class="cx-badge ' + cls + '"><span class="dot"></span>' + esc(label) + '</div>' +
			'<p class="cx-ttl">' + esc(obj.title || "Unknown") + '</p>' +
			'<p class="cx-artist">' + esc(obj.artist || "") + '</p></div>' + acts + '</div>';
	}

	var MATCH_SOURCE = { apple: "iTunes", spotify: "Spotify", youtube: "YouTube" };

	function render(source, targets) {
		var html = '<div class="cx-card">' + sideHtml(source, "source");
		for (var i = 0; i < targets.length; i++) {
			var t = targets[i];
			var via = t.matchedBy === "exact" ? "matched via " + MATCH_SOURCE[t.service] : "search link";
			html += '<div class="cx-arrow">↓ ' + esc(via) + ' ↓</div>' + sideHtml(t, "target");
			if (t.matchedBy === "search") {
				html += '<div class="cx-warn">No exact match found — the button opens a ' +
					esc(SVC[t.service].name) + ' search for the title &amp; artist instead.</div>';
			}
		}
		html += '</div>';
		statusEl.innerHTML = html;

		var copies = statusEl.querySelectorAll(".copy");
		for (var i = 0; i < copies.length; i++) {
			copies[i].addEventListener("click", function () {
				var b = this, u = b.getAttribute("data-url");
				var done = function () {
					var prev = b.textContent; b.textContent = "Copied"; b.className += " copied";
					setTimeout(function () { b.textContent = prev; b.className = b.className.replace(" copied", ""); }, 1500);
				};
				if (navigator.clipboard && navigator.clipboard.writeText) {
					navigator.clipboard.writeText(u).then(done, done);
				} else {
					var t = document.createElement("textarea"); t.value = u; document.body.appendChild(t); t.select();
					try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(t); done();
				}
			});
		}
	}

	button.addEventListener("click", run);
	input.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
})();
</script>
</body>
</html>
