<!DOCTYPE html>
<html>
<head>
	<title>Link Converter</title>
	<meta charset="utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
	<link href="https://fonts.googleapis.com/css?family=Libre+Barcode+128+Text|Merriweather|Sunflower:300" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="css/global.css">
	<link rel="stylesheet" type="text/css" href="css/converter.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="scripts.js"></script>
	<script src="https://kit.fontawesome.com/79f6ff16aa.js" crossorigin="anonymous"></script>
</head>
<body>
<div id="header-wrapper"></div>
<div class="jumbotron">
	<h1>Link Converter</h1>
	<p>Spotify &harr; Apple Music</p>
</div>
<div class="project container" id="converter">
	<div class="cx-wrap">
		<div class="cx-bar">
			<input id="cx-url" class="cx-input" type="url" inputmode="url" autocomplete="off"
			       spellcheck="false" placeholder="Paste a Spotify or Apple Music link&hellip;"
			       aria-label="Music link" />
			<button id="cx-go" class="cx-go">Convert</button>
		</div>
		<p class="cx-tip">Paste a song link from either service and get the match on the other.</p>
		<div id="cx-status" aria-live="polite"></div>
	</div>
</div>

<script>
(function () {
	var SVC = { spotify: { name: "Spotify" }, apple: { name: "Apple Music" } };
	var input = document.getElementById("cx-url");
	var button = document.getElementById("cx-go");
	var statusEl = document.getElementById("cx-status");

	function esc(s) {
		return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
		});
	}
	function setLoading(on) { button.disabled = on; button.textContent = on ? "Working…" : "Convert"; }
	function note(msg, err) { statusEl.innerHTML = '<div class="cx-note' + (err ? " err" : "") + '">' + msg + "</div>"; }
	function loading() { statusEl.innerHTML = '<div class="cx-note"><span class="cx-spin"></span>Finding it on the other service…</div>'; }

	function detectService(url) {
		if (/open\.spotify\.com\/track\//.test(url)) return "spotify";
		if (/music\.apple\.com\//.test(url)) return "apple";
		return null;
	}

	function getSpotifyMeta(url) {
		return fetch("https://open.spotify.com/oembed?url=" + encodeURIComponent(url))
			.then(function (r) {
				if (!r.ok) throw new Error("oEmbed failed");
				return r.json();
			})
			.then(function (d) {
				return { title: d.title || "", artist: d.author_name || "", artwork: d.thumbnail_url };
			});
	}

	function itunesJsonp(id) {
		return new Promise(function (resolve, reject) {
			var cb = "_itcb_" + Math.random().toString(36).slice(2);
			var script = document.createElement("script");
			var timer = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, 8000);
			function cleanup() {
				delete window[cb];
				if (script.parentNode) script.parentNode.removeChild(script);
				clearTimeout(timer);
			}
			window[cb] = function (data) { cleanup(); resolve(data); };
			script.onerror = function () { cleanup(); reject(new Error("load error")); };
			script.src = "https://itunes.apple.com/lookup?id=" + id + "&entity=song&callback=" + cb;
			document.head.appendChild(script);
		});
	}

	function parseAppleIds(url) {
		try {
			var u = new URL(url);
			var trackId = u.searchParams.get("i");
			var parts = u.pathname.split("/").filter(Boolean);
			var pathId = /^\d+$/.test(parts[parts.length - 1]) ? parts[parts.length - 1] : null;
			return { trackId: trackId, albumId: pathId };
		} catch (e) { return {}; }
	}

	function getAppleMeta(url) {
		var ids = parseAppleIds(url);
		var id = ids.trackId || ids.albumId;
		if (!id) return Promise.reject(new Error("Can’t parse Apple Music URL"));
		return itunesJsonp(id).then(function (d) {
			if (!d.results || !d.results.length) throw new Error("Not found");
			var track = null;
			for (var i = 0; i < d.results.length; i++) {
				if (d.results[i].wrapperType === "track") { track = d.results[i]; break; }
			}
			var result = track || d.results[0];
			return {
				title: result.trackName || result.collectionName,
				artist: result.artistName,
				artwork: result.artworkUrl100 ? result.artworkUrl100.replace("100x100bb", "300x300bb") : null
			};
		});
	}

	function searchApple(title, artist) {
		var term = encodeURIComponent(artist ? title + " " + artist : title);
		return fetch("https://itunes.apple.com/search?term=" + term + "&entity=song&limit=1")
			.then(function (r) { return r.json(); })
			.then(function (d) {
				return d.results && d.results[0] && d.results[0].trackViewUrl || null;
			});
	}

	function spotifySearchUrl(title, artist) {
		return "https://open.spotify.com/search/" + encodeURIComponent(artist ? title + " " + artist : title);
	}

	function run() {
		var raw = input.value.trim();
		if (!raw) { input.focus(); return; }
		var service = detectService(raw);
		if (!service) {
			note("Paste a Spotify track link or Apple Music link.", true);
			return;
		}
		setLoading(true); loading();

		var metaP = service === "spotify" ? getSpotifyMeta(raw) : getAppleMeta(raw);
		metaP.then(function (meta) {
			if (service === "spotify") {
				return searchApple(meta.title, meta.artist).then(function (appleUrl) {
					render({
						source: { service: "spotify", url: raw, title: meta.title, artist: meta.artist, artwork: meta.artwork },
						target: { service: "apple", url: appleUrl || ("https://music.apple.com/search#" + encodeURIComponent(meta.artist ? meta.title + " " + meta.artist : meta.title)), title: meta.title, artist: meta.artist, artwork: meta.artwork },
						matchedBy: appleUrl ? "exact" : "search",
						targetService: "apple"
					});
				});
			} else {
				render({
					source: { service: "apple", url: raw, title: meta.title, artist: meta.artist, artwork: meta.artwork },
					target: { service: "spotify", url: spotifySearchUrl(meta.title, meta.artist), title: meta.title, artist: meta.artist, artwork: meta.artwork },
					matchedBy: "search",
					targetService: "spotify"
				});
			}
		}).catch(function () {
			note("Couldn’t get track info. Check the link and try again.", true);
		}).then(function () { setLoading(false); });
	}

	function sideHtml(obj, role) {
		var svc = SVC[obj.service] || { name: obj.service };
		var cls = obj.service === "spotify" ? "spotify" : "apple";
		var art = obj.artwork ? '<img class="cx-art" src="' + esc(obj.artwork) + '" alt="" />' : '<div class="cx-art"></div>';
		var label = (role === "source" ? "From " : "") + svc.name;
		var acts = (role === "target")
			? '<div class="cx-acts"><button class="cx-btn copy" data-url="' + esc(obj.url) + '">Copy</button>' +
			  '<a class="cx-btn" href="' + esc(obj.url) + '" target="_blank" rel="noopener">Open</a></div>'
			: '<div class="cx-acts"><a class="cx-btn" href="' + esc(obj.url) + '" target="_blank" rel="noopener">Open</a></div>';
		return '<div class="cx-side">' + art +
			'<div class="cx-meta"><div class="cx-badge ' + cls + '"><span class="dot"></span>' + esc(label) + '</div>' +
			'<p class="cx-ttl">' + esc(obj.title || "Unknown") + '</p>' +
			'<p class="cx-artist">' + esc(obj.artist || "") + '</p></div>' + acts + '</div>';
	}

	function render(d) {
		var html = '<div class="cx-card">' + sideHtml(d.source, "source");
		var via = d.matchedBy === "exact" ? "matched via iTunes" : "search link";
		html += '<div class="cx-arrow">↓ ' + esc(via) + ' ↓</div>' + sideHtml(d.target, "target");
		if (d.matchedBy === "search") {
			html += '<div class="cx-warn">No exact match found — the button opens a ' +
				esc(SVC[d.targetService].name) + ' search for the title &amp; artist instead.</div>';
		}
		html += '</div>';
		statusEl.innerHTML = html;

		var copies = statusEl.querySelectorAll(".copy");
		for (var i = 0; i < copies.length; i++) {
			copies[i].addEventListener("click", function () {
				var b = this, u = b.getAttribute("data-url");
				var done = function () {
					var prev = b.textContent; b.textContent = "Copied"; b.className += " copied";
					setTimeout(function () { b.textContent = prev; b.className = b.className.replace(" copied", ""); }, 1500);
				};
				if (navigator.clipboard && navigator.clipboard.writeText) {
					navigator.clipboard.writeText(u).then(done, done);
				} else {
					var t = document.createElement("textarea"); t.value = u; document.body.appendChild(t); t.select();
					try { document.execCommand("copy"); } catch (e) {} document.body.removeChild(t); done();
				}
			});
		}
	}

	button.addEventListener("click", run);
	input.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
})();
</script>
</body>
</html>
